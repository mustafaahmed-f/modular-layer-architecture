services:
  app-test:
    # container_name: app-test
    build:
      context: .
      target: development
    env_file:
      - ./.env.test
    environment:
      - CHOKIDAR_USEPOLLING=true
    image: modular-layer-architecture:dev
    ports:
      - "3001:3000" # //* HOST_PORT : CONTAINER_PORT
    volumes:
      - .:/app
      - /app/node_modules # //* prevents node_modules overwrite.
    command: npm run dev
    depends_on:
      mysql-test:
        condition: service_healthy
    networks:
      - app-network-test

  mysql-test:
    image: mysql:latest
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: mypassword
      MYSQL_DATABASE: app_test
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 5
    ports:
      - "3308:3306"
    volumes:
      - app-sql-data-test:/var/lib/mysql
    networks:
      - app-network-test

  phpmyadmin-test:
    image: phpmyadmin:latest
    restart: unless-stopped # //* Doesn’t restart if you manually stop it
    environment:
      PMA_HOST: mysql-test
      PMA_USER: root
      PMA_PASSWORD: mypassword
    ports:
      - "8082:80"
    depends_on:
      mysql-test:
        condition: service_healthy
    networks:
      - app-network-test

networks:
  app-network-test:
    driver: bridge

volumes:
  app-sql-data-test:

    #* npm run docker:test:up       -> docker compose -f docker-compose.test.yml up -d
    #* npm run docker:test:down     -> docker compose -f docker-compose.test.yml down
    #* npm run docker:test:logs     -> docker compose -f docker-compose.test.yml logs -f app-test
